
services:
  mongodb:
    image: mongo:latest
    container_name: stuhub-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - stuhub-mongo-data:/data/db
    networks:
      - stuhub-network
    command: ["mongod", "--quiet", "--setParameter", "logComponentVerbosity={network:{verbosity:-1},accessControl:{verbosity:-1}}"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stuhub-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/stuhub
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - stuhub-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.json()).then(d => { if(d.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stuhub-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stuhub-network

networks:
  stuhub-network:
    driver: bridge

volumes:
  stuhub-mongo-data:
